[build-system]
requires = ["hatchling==1.33.0"]  # pinned: reproducible release builds
build-backend = "hatchling.build"

[project]
name = "faststudio"
dynamic = ["version"]
description = "Plug-and-play admin panel for FastAPI and SQLAlchemy 2.0 with a modern React UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Bekzod" }]
keywords = [
  "fastapi",
  "admin",
  "admin-panel",
  "sqlalchemy",
  "dashboard",
  "crud",
  "react",
  "starlette",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.120.1",
  # 0.49.1 fixes the Range-header DoS in FileResponse/StaticFiles (CVE-2025-62727).
  "starlette>=0.49.1",
  "anyio>=4.0",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "pydantic>=2.10,<3",
  "itsdangerous>=2.1",
  "argon2-cffi>=23.1",
]

[project.scripts]
faststudio = "faststudio.cli:console_main"

[project.urls]
Homepage = "https://github.com/bekzod818/faststudio"
Repository = "https://github.com/bekzod818/faststudio"
Issues = "https://github.com/bekzod818/faststudio/issues"
Changelog = "https://github.com/bekzod818/faststudio/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "ruff>=0.15",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  # The test leak guard relies on the worker thread name of these releases
  # (tests/_leaks.py). Keep in sync with the test-lowest job in ci.yml.
  "aiosqlite>=0.22.1,<0.23",
  "uvicorn>=0.34",
  "bandit>=1.8",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "asyncpg>=0.30",
  "alembic>=1.20.1",
  "aiomysql[rsa]>=0.2",
]

# ---------------------------------------------------------------- hatch
[tool.hatch.version]
path = "src/faststudio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/faststudio"]
# static/ is gitignored, so it must be force-included explicitly.
artifacts = ["src/faststudio/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/faststudio",
  "tests",
  "hatch_build.py",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]
artifacts = ["src/faststudio/static/**"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# tests/compat/v0_1_0: a frozen v0.1.0 snapshot, kept byte-identical (SNAPSHOT.md).
extend-exclude = ["frontend", "tests/compat/v0_1_0"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RET", "PTH",
  "PL", "RUF", "ASYNC", "PT", "TID", "ANN", "D",
]
ignore = [
  "D100", "D104", "D105", "D107", "D203", "D213",
  "PLR0913",  # Admin.__init__ intentionally has many keyword-only options
  "S101",     # asserts allowed for type narrowing; tests override anyway
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D", "ANN", "PLR2004", "PLR0915"]
"scripts/**" = ["D", "T20"]
"examples/**" = ["D", "S105"]
"hatch_build.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["faststudio", "examples"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts", "examples"]
# Frozen v0.1.0 snapshot (tests/compat/v0_1_0/SNAPSHOT.md): excluded from discovery, but still
# type-checked through tests/compat/test_v0_1_0.py's imports, which surfaces typing breaks that
# would hit v0.1 users (fix FastStudio, never the snapshot).
exclude = ["^tests/compat/v0_1_0/"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hatchling.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "e2e: wheel-install smoke tests (slow, need a built wheel)",
  "postgres: need a PostgreSQL server (FASTSTUDIO_TEST_POSTGRES_URL)",
  "mysql: need a MySQL server (FASTSTUDIO_TEST_MYSQL_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["faststudio"]
branch = true
# SQLAlchemy's asyncio layer runs code in greenlets; trace them too.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", "frontend", "examples"]

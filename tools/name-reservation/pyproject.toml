# Name-reservation placeholder for PyPI. NOT the real package.
# Build from this directory only: `uv build` (outputs to ./dist).
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "faststudio"
version = "0.0.1"
description = "Plug-and-play admin panel for FastAPI and SQLAlchemy 2.0 with a modern React UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Bekzod" }]
keywords = ["fastapi", "admin", "admin-panel", "sqlalchemy", "dashboard", "crud", "react", "starlette"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/bekzod818/faststudio"
Repository = "https://github.com/bekzod818/faststudio"

[tool.hatch.build.targets.wheel]
packages = ["src/faststudio"]

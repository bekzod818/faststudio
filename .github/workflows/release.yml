name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Manual publish target (tag pushes always go to PyPI)"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          # No dependency caches anywhere in the publishing pipeline.
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check tag matches __version__
        if: github.event_name == 'push'
        run: |
          version=$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/faststudio/__init__.py').read_text()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      # Full gate on the exact commit being released: a tag on a red commit
      # must not publish.
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest
      - run: uv run bandit -c pyproject.toml -q -r src
      - run: uv export --color never --no-header --no-emit-project --format requirements-txt -o /tmp/requirements.txt && uv run pip-audit --strict --no-deps --disable-pip -r /tmp/requirements.txt
      - run: pnpm -C frontend install --frozen-lockfile
      - run: pnpm -C frontend lint && pnpm -C frontend typecheck && pnpm -C frontend test
      - run: pnpm -C frontend audit --prod
      - run: pnpm -C frontend build
      - run: uv build
      - run: uv run --no-project python scripts/verify_wheel.py dist/*.whl
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Wheel smoke test (installed wheel, no source tree)
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl pytest pytest-asyncio httpx aiosqlite
          FASTSTUDIO_WHEEL_SMOKE=1 /tmp/smoke/bin/python -m pytest tests/e2e -m e2e -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/faststudio
    permissions:
      id-token: write # OIDC Trusted Publishing, no API tokens
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/faststudio
    permissions:
      id-token: write # OIDC Trusted Publishing, no API tokens
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Extract changelog section
        run: uv run --no-project python scripts/changelog_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *a*|*b*|*rc*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag ${prerelease}

name: Bug report
description: Something in FastStudio does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must not be filed here**; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest FastAPI app + models + ModelAdmin that shows the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FastStudio version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python, FastAPI, SQLAlchemy, database driver, OS, browser.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / tracebacks
      render: text
